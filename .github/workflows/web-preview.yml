name: Web Preview

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, closed, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Resolve Cloudflare preview origin
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web') &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-web
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
      subdomain: ${{ steps.preview.outputs.subdomain }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: preview
        name: Resolve preview origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-web-preview.mjs resolve "$PR_NUMBER"

  build:
    name: Build web preview without deployment credentials
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@rove-code/scripts...
              - --filter=@rove-code/web...
      - name: Build preview
        env:
          VITE_HOSTED_APP_URL: ${{ needs.resolve.outputs.origin }}
        run: vp run build:web:hosted
      - uses: actions/upload-artifact@v7
        with:
          name: web-preview
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy isolated Cloudflare preview
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@rove-code/scripts...
      - uses: actions/download-artifact@v8
        with:
          name: web-preview
          path: apps/web/dist
      - name: Prepare isolated Worker configuration
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SUBDOMAIN: ${{ needs.resolve.outputs.subdomain }}
        run: |
          node scripts/cloudflare-web-preview.mjs config "$PR_NUMBER" "$RUNNER_TEMP/wrangler-preview.json" "$PREVIEW_SUBDOMAIN"
          node scripts/check-cloudflare-web.mjs --built-schema
      - name: Deploy static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp dlx wrangler@4.147.0 deploy --config "$RUNNER_TEMP/wrangler-preview.json"
      - name: Verify preview schema
        env:
          PREVIEW_ORIGIN: ${{ needs.resolve.outputs.origin }}
        run: node scripts/check-cloudflare-web.mjs --url "$PREVIEW_ORIGIN" --built-schema
      - name: Comment preview URL
        uses: actions/github-script@v8
        env:
          PREVIEW_ORIGIN: ${{ needs.resolve.outputs.origin }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- web-preview-deploy -->';
            const body = [marker, '### Web preview', '',
              `${process.env.PREVIEW_ORIGIN} for ${process.env.HEAD_SHA.slice(0, 7)}`,
              '', 'Pair your own HTTPS Rove environment to use this preview.',
            ].join('\n');
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  cleanup:
    name: Remove closed Cloudflare preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Delete only this PR's Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-web-preview.mjs delete "$PR_NUMBER"
      - name: Mark preview removed
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- web-preview-deploy -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id,
                body: `${marker}\n### Web preview\n\nPreview removed.`,
              });
            }
