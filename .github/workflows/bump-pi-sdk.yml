name: Bump Pi SDK

on:
  schedule:
    # Weekly on Monday morning UTC; Pi ships minors roughly weekly.
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time: two overlapping runs would race on the same bot branch.
concurrency:
  group: bump-pi-sdk
  cancel-in-progress: true

jobs:
  bump:
    name: Open Pi SDK bump PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Commits as github-actions[bot] so history shows the bump is automated.
      # Must run before the bump step creates its commit.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Pi SDK and open PR when outdated
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bump-pi-sdk.ts
