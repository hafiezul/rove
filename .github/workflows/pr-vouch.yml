name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - .github/VOUCHED.td
      - .github/workflows/pr-vouch.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  collect-targets:
    name: Collect PR targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              core.setOutput("targets", JSON.stringify([{ number: pr.number, user: pr.user.login }]));
              return;
            }

            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body ?? "";
              if (!issue?.pull_request || !body.includes("/recheck-vouch")) {
                core.setOutput("targets", "[]");
                return;
              }

              core.setOutput(
                "targets",
                JSON.stringify([{ number: issue.number, user: issue.user.login }]),
              );
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const targets = pulls.map((pull) => ({
              number: pull.number,
              user: pull.user.login,
            }));
            core.setOutput("targets", JSON.stringify(targets));

  label:
    name: Label PR ${{ matrix.target.number }}
    needs: collect-targets
    if: ${{ needs.collect-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-vouch-${{ matrix.target.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.collect-targets.outputs.targets) }}
    steps:
      - id: vouch
        name: Check PR author trust
        uses: actions/github-script@v8
        env:
          PR_USER: ${{ matrix.target.user }}
        with:
          script: |
            const user = process.env.PR_USER ?? "";
            const normalizedUser = user.toLowerCase();
            let status = "unknown";

            // Match vouch's trust order: bots always pass, then collaborators
            // with write access, then the default branch's VOUCHED.td file.
            if (user.endsWith("[bot]")) {
              status = "bot";
            } else {
              const collaborator = await github.rest.repos
                .getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: user,
                })
                .catch(() => undefined);

              if (["admin", "write"].includes(collaborator?.data.permission)) {
                status = "collaborator";
              } else {
                const vouchedFile = await github.rest.repos
                  .getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: ".github/VOUCHED.td",
                    ref: context.payload.repository.default_branch,
                  })
                  .catch(() => undefined);
                const file = vouchedFile?.data;

                if (file && !Array.isArray(file) && typeof file.content === "string") {
                  const contents = Buffer.from(file.content, "base64").toString("utf8");
                  for (const rawLine of contents.split(/\r?\n/)) {
                    const line = rawLine.trim();
                    if (line.length === 0 || line.startsWith("#")) {
                      continue;
                    }

                    const denounced = line.startsWith("-");
                    const handle = line
                      .slice(denounced ? 1 : 0)
                      .trim()
                      .split(/\s+/, 1)[0];
                    if (!handle) {
                      continue;
                    }

                    const [platform, username] = handle.includes(":")
                      ? handle.split(":", 2)
                      : ["github", handle];
                    if (
                      platform.toLowerCase() === "github" &&
                      username.toLowerCase() === normalizedUser
                    ) {
                      status = denounced ? "denounced" : "vouched";
                      break;
                    }
                  }
                }
              }
            }

            core.setOutput("status", status);
            core.setOutput("vouched", ["bot", "collaborator", "vouched"].includes(status));
            core.info(`User ${user}: ${status}`);

      - name: Sync PR labels
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER);
            const status = process.env.VOUCH_STATUS;
            const managedLabels = [
              {
                name: "vouch:trusted",
                color: "1f883d",
                description: "PR author is trusted by repo permissions or the VOUCHED list.",
              },
              {
                name: "vouch:unvouched",
                color: "fbca04",
                description: "PR author is not yet trusted in the VOUCHED list.",
              },
              {
                name: "vouch:denounced",
                color: "d1242f",
                description: "PR author is explicitly blocked by the VOUCHED list.",
              },
            ];

            const managedLabelNames = new Set(managedLabels.map((label) => label.name));

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            const nextLabelName =
              status === "denounced"
                ? "vouch:denounced"
                : ["bot", "collaborator", "vouched"].includes(status)
                  ? "vouch:trusted"
                  : "vouch:unvouched";

            const isUnresolvableLabelableError = (error) =>
              error?.status === 422 &&
              String(error?.message ?? "").includes(
                "Could not resolve to a node with the global id",
              );

            try {
              const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              for (const label of currentLabels) {
                if (!managedLabelNames.has(label.name) || label.name === nextLabelName) {
                  continue;
                }

                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label.name,
                  });
                } catch (removeError) {
                  if (removeError.status !== 404) {
                    throw removeError;
                  }
                }
              }

              if (!currentLabels.some((label) => label.name === nextLabelName)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [nextLabelName],
                });
              }
            } catch (error) {
              if (!isUnresolvableLabelableError(error)) {
                throw error;
              }

              core.warning(
                `GitHub could not resolve PR #${issueNumber} for label synchronization; leaving managed labels unchanged.`,
              );
              return;
            }

            core.info(`PR #${issueNumber}: ${status} -> ${nextLabelName}`);
