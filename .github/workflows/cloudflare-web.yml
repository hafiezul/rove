name: Cloudflare web

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the browser app to Cloudflare after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-web
  cancel-in-progress: false

jobs:
  build:
    name: Build hosted web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...

      - name: Set hosted origin
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("apps/web/wrangler.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `VITE_HOSTED_APP_URL=https://${config.routes[0].pattern}\n`);
          '

      - name: Test hosted build configuration
        run: |
          vp test run apps/web/vite/hostedBuild.test.ts
          node --test scripts/check-cloudflare-web.test.mjs

      - name: Build
        run: vp run build:web:hosted

      - name: Validate Cloudflare configuration without deploying
        run: vp dlx wrangler@4.147.0 deploy --config apps/web/wrangler.json --dry-run

      - name: Save deployable assets
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-web
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy hosted web
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-web
          path: apps/web/dist

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Deploy static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --config apps/web/wrangler.json
