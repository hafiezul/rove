name: Cloudflare marketing

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the marketing site to Cloudflare after building
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      ref:
        description: Commit to build. Defaults to the triggering ref.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-marketing
  cancel-in-progress: false

jobs:
  build:
    name: Build marketing site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@rove-code/marketing...

      - name: Set site origin
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("apps/marketing/wrangler.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `ROVE_MARKETING_SITE_URL=https://${config.routes[0].pattern}\n`);
          '

      - name: Build
        run: vp run --filter @rove-code/marketing build

      - name: Validate Cloudflare configuration without deploying
        run: vp dlx wrangler@4.147.0 deploy --config apps/marketing/wrangler.json --dry-run

      - name: Save deployable assets
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-marketing
          path: apps/marketing/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy marketing site
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-marketing
          path: apps/marketing/dist

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Deploy static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --config apps/marketing/wrangler.json
